
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Monticola solitarius (Linnaeus, 1758)</title>
<style>
body {
    font-family: Georgia, serif;
    margin: 0;
    text-align: center;
}

.lightbox {
    display: none;
    position: fixed;
    z-index: 5000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.lightbox img {
    max-width: 95%;
    max-height: 95%;
    object-fit: contain;
    border-radius: 10px;
}

.image-pair img {
    cursor: zoom-in;
}

.header {
    display: grid;
    grid-template-columns: 60px 1fr 60px;
    align-items: center;
    position: sticky;
    top: 0;
    background: white;
    padding: 10px 20px;
    border-bottom: 2px solid #822433;
}

.header h1 {
    margin: 0;
    color: #822433;
    font-style: italic;
}

.image-pair {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
}

.image-pair img {
    max-height: 500px;
    max-width: 45%;
    border: 2px solid #822433;
    border-radius: 8px;
    object-fit: contain;
}

table {
    margin: 30px auto;
    border-collapse: collapse;
    width: 65%;
    text-align: left;
}

td {
    border: 1px solid #999;
    padding: 10px;
    background: #f8f8f8;
}

td:first-child {
    font-weight: bold;
}

.scientific {
    font-style: italic;
}

.btn-search {
    background: #822433;
    color: white;
    padding: 6px 12px;
    text-decoration: none;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    box-sizing: border-box;
}

.btn-search:hover {
    background: #a0324c;
}

.footer-logo {
    position: fixed;
    bottom: 10px;
    left: 10px;
    height: 60px;
}
</style>
</head>

<body>

<div class="header">
    <a href="index.html"><img src="img/home.png" height="40"></a>
    <h1>Monticola solitarius (Linnaeus, 1758)</h1>
    <a class="btn-search" href="search.html">Search</a>
</div>

<div class="image-pair">

    <img src="img/MZURORN2025-224_1.jpg" onclick="openImage(this.src)">

    <img src="img/MZURORN2025-224_2.jpg" onclick="openImage(this.src)">

</div>


<div id="lightbox" class="lightbox" onclick="closeImage()">
    <img id="lightbox-img">
</div>

<table>
<tr><td>Occurrence</td><td>MZURORN2025-224</td></tr>
<tr><td>Scientific name</td><td class="scientific">Monticola solitarius (Linnaeus, 1758)</td></tr>
<tr><td>Common name</td><td>Blue rock thrush</td></tr>
<tr><td>Sex</td><td></td></tr>
<tr><td>Continent</td><td>Europa</td></tr>
<tr><td>Country</td><td>Italy</td></tr>
<tr><td>Locality</td><td>Rome</td></tr>
<tr><td>Date</td><td>01/01/1970</td></tr>
<tr><td>Life stage</td><td>Adult</td></tr>
<tr><td>Latitude</td><td>41.9</td></tr>
<tr><td>Longitude</td><td>12.483333</td></tr>
</table>

<img class="footer-logo" src="img/logo.png">
<script>

function openImage(src) {

    const lightbox = document.getElementById("lightbox");
    const img = document.getElementById("lightbox-img");

    img.src = src;

    lightbox.style.display = "flex";
}

function closeImage() {

    document.getElementById("lightbox").style.display = "none";
}

</script>
</body>
</html>
